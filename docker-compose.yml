services:
  backend:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-techpath}:${POSTGRES_PASSWORD:-techpath}@postgres:5432/${POSTGRES_DB:-techpath}
      # Dentro do Docker o SMTP de desenvolvimento é o serviço "mailpit".
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpath}
      POSTGRES_DB: ${POSTGRES_DB:-techpath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - techpath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techpath} -d ${POSTGRES_DB:-techpath}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SMTP falso para desenvolvimento: captura todos os e-mails, nada sai para a internet.
  # Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  techpath_postgres_data:
