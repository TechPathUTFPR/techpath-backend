services:
  backend:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-techpath}:${POSTGRES_PASSWORD:-techpath}@postgres:5432/${POSTGRES_DB:-techpath}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpath}
      POSTGRES_DB: ${POSTGRES_DB:-techpath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - techpath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techpath} -d ${POSTGRES_DB:-techpath}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  techpath_postgres_data:
